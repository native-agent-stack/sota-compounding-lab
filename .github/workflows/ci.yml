name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sota-compounding-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync locked environment
        run: uv sync --locked

      - name: Ruff lint & format gate
        run: |
          uv run ruff check src scripts tests
          uv run ruff format --check src scripts tests

      - name: MADR 4.0 ADR catalog & zero-leak privacy gate
        run: uv run python scripts/architecture_catalog.py --check

      - name: Org Public/Private visibility firewall policy test
        run: uv run python scripts/org_visibility_doctor.py --offline

      - name: Pytest & Hypothesis property-based invariant suite
        run: uv run pytest -v
